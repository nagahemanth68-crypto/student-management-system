
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            color: #172033;
        }

        header {
            background: #263f80;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        header p {
            margin: 0;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin-bottom: 26px;
        }

        .stat-card, .panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(20, 40, 80, 0.07);
        }

        .stat-card {
            padding: 25px;
            border-left: 6px solid #3459d1;
        }

        .stat-icon {
            font-size: 28px;
        }

        .stat-label {
            color: #64748b;
            margin: 12px 0 8px;
        }

        .stat-value {
            color: #263f80;
            font-size: 32px;
            font-weight: bold;
        }

        .panel {
            padding: 28px;
            margin-bottom: 26px;
        }

        h2 {
            color: #263f80;
            margin: 0 0 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        input:focus, select:focus {
            outline: 2px solid #9bb5ff;
            border-color: #3459d1;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        button {
            padding: 12px 19px;
            border: none;
            border-radius: 8px;
            background: #3459d1;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary {
            background: #64748b;
        }

        .edit-btn {
            background: #0f766e;
            padding: 8px 12px;
        }

        .delete-btn {
            background: #dc2626;
            padding: 8px 12px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 12px;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #edf2ff;
            color: #263f80;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 8px;
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .message.info {
            display: block;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 750px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .form-grid, .search-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 20px;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage student records in one place</p>
</header>

<main class="container">

    <section class="dashboard">
        <div class="stat-card">
            <div class="stat-icon">👨‍🎓</div>
            <div class="stat-label">Total Students</div>
            <div class="stat-value" id="totalStudents">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">📚</div>
            <div class="stat-label">Total Courses</div>
            <div class="stat-value" id="totalCourses">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">📊</div>
            <div class="stat-label">Average Age</div>
            <div class="stat-value" id="averageAge">0</div>
        </div>
    </section>

    <section class="panel">
        <h2 id="formTitle">Register a Student</h2>

        <form id="studentForm">
            <div class="form-grid">
                <div class="field">
                    <label for="name">Full Name</label>
                    <input id="name" name="name" type="text"
                           maxlength="100" required
                           placeholder="Enter full name">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email"
                           maxlength="254" required
                           placeholder="student@example.com">
                </div>

                <div class="field">
                    <label for="course">Course</label>
                    <input id="course" name="course" type="text"
                           maxlength="100" required
                           placeholder="Enter course">
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input id="age" name="age" type="number"
                           min="1" max="120" step="1" required
                           placeholder="Enter age">
                </div>
            </div>

            <div class="actions">
                <button type="submit" id="submitButton">Add Student</button>
                <button type="button" class="secondary"
                        id="cancelButton" hidden>Cancel Edit</button>
            </div>
        </form>

        <div id="formMessage" class="message" role="status"
             aria-live="polite"></div>
    </section>

    <section class="panel">
        <h2>Student Records</h2>

        <div class="search-grid">
            <input type="search" id="searchInput"
                   placeholder="Search by name or email">

            <select id="courseFilter">
                <option value="">All Courses</option>
            </select>

            <button type="button" id="refreshButton"
                    class="secondary">Refresh</button>
        </div>

        <div id="listMessage" class="message" role="status"
             aria-live="polite"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    Student Management System | Java · Spring Boot · MySQL
</footer>

<script>
    const apiUrl = "/api/students";

    let allStudents = [];
    let editingId = null;
    let loading = false;

    const form = document.getElementById("studentForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const courseInput = document.getElementById("course");
    const ageInput = document.getElementById("age");

    const submitButton = document.getElementById("submitButton");
    const cancelButton = document.getElementById("cancelButton");
    const formTitle = document.getElementById("formTitle");
    const formMessage = document.getElementById("formMessage");
    const listMessage = document.getElementById("listMessage");
    const tableBody = document.getElementById("studentTableBody");
    const searchInput = document.getElementById("searchInput");
    const courseFilter = document.getElementById("courseFilter");

    function showMessage(element, message, type = "error") {
        element.textContent = message;
        element.className = "message " + type;
    }

    function clearMessage(element) {
        element.textContent = "";
        element.className = "message";
    }

    async function request(url, options = {}) {
        let response;

        try {
            response = await fetch(url, options);
        } catch (error) {
            throw new Error(
                "Cannot connect to the server. Check that the application is running."
            );
        }

        const text = await response.text();
        let data = null;

        if (text) {
            try {
                data = JSON.parse(text);
            } catch {
                data = null;
            }
        }

        if (!response.ok) {
            if (response.status === 409) {
                throw new Error(
                    data?.error || "This email is already registered."
                );
            }

            if (response.status === 400) {
                throw new Error(
                    data?.error || "Please check the details you entered."
                );
            }

            if (response.status === 404) {
                throw new Error("The requested student was not found.");
            }

            if (response.status >= 500) {
                throw new Error(
                    "A server error occurred. Please try again."
                );
            }

            throw new Error(
                data?.error || "The request could not be completed."
            );
        }

        return data;
    }

    async function loadStudents() {
        clearMessage(listMessage);

        try {
            const data = await request(apiUrl);

            if (!Array.isArray(data)) {
                throw new Error("The server returned an unexpected response.");
            }

            allStudents = data;
            updateDashboard();
            updateCourseFilter();
            renderStudents();
        } catch (error) {
            showMessage(listMessage, error.message);
        }
    }

    function updateDashboard() {
        document.getElementById("totalStudents").textContent =
            allStudents.length;

        const courses = new Set(
            allStudents
                .map(student => (student.course || "").trim().toLowerCase())
                .filter(Boolean)
        );

        document.getElementById("totalCourses").textContent = courses.size;

        const ages = allStudents
            .map(student => Number(student.age))
            .filter(age => Number.isFinite(age) && age > 0);

        const average = ages.length
            ? ages.reduce((sum, age) => sum + age, 0) / ages.length
            : 0;

        document.getElementById("averageAge").textContent =
            average.toFixed(1);
    }

    function updateCourseFilter() {
        const previousValue = courseFilter.value;

        const courses = [...new Set(
            allStudents
                .map(student => (student.course || "").trim())
                .filter(Boolean)
                .sort((a, b) => a.localeCompare(b))
        )];

        courseFilter.replaceChildren();

        const allOption = document.createElement("option");
        allOption.value = "";
        allOption.textContent = "All Courses";
        courseFilter.appendChild(allOption);

        courses.forEach(course => {
            const option = document.createElement("option");
            option.value = course.toLowerCase();
            option.textContent = course;
            courseFilter.appendChild(option);
        });

        if ([...courseFilter.options].some(
            option => option.value === previousValue
        )) {
            courseFilter.value = previousValue;
        }
    }

    function renderStudents() {
        const search = searchInput.value.trim().toLowerCase();
        const selectedCourse = courseFilter.value;

        const filteredStudents = allStudents.filter(student => {
            const name = (student.name || "").toLowerCase();
            const email = (student.email || "").toLowerCase();
            const course = (student.course || "").trim().toLowerCase();

            return (
                (name.includes(search) || email.includes(search)) &&
                (!selectedCourse || course === selectedCourse)
            );
        });

        tableBody.replaceChildren();

        if (filteredStudents.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 6;
            cell.className = "empty";
            cell.textContent = allStudents.length
                ? "No students match your search."
                : "No students registered yet.";

            row.appendChild(cell);
            tableBody.appendChild(row);
            return;
        }

        filteredStudents.forEach(student => {
            const row = document.createElement("tr");

            [
                student.id,
                student.name,
                student.email,
                student.course,
                student.age
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            const actionsCell = document.createElement("td");
            const actions = document.createElement("div");
            actions.className = "table-actions";

            const editButton = document.createElement("button");
            editButton.type = "button";
            editButton.className = "edit-btn";
            editButton.textContent = "Edit";
            editButton.addEventListener("click", () => editStudent(student.id));

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener(
                "click", () => deleteStudent(student.id)
            );

            actions.append(editButton, deleteButton);
            actionsCell.appendChild(actions);
            row.appendChild(actionsCell);
            tableBody.appendChild(row);
        });
    }

    function validateForm() {
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const course = courseInput.value.trim();
        const age = Number(ageInput.value);

        if (!name || !email || !course || ageInput.value.trim() === "") {
            throw new Error("Please fill in all fields.");
        }

        if (name.length > 100 || course.length > 100) {
            throw new Error(
                "Name and course must be at most 100 characters."
            );
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            throw new Error("Please enter a valid email address.");
        }

        if (!Number.isInteger(age) || age < 1 || age > 120) {
            throw new Error("Age must be a whole number between 1 and 120.");
        }

        return { name, email, course, age };
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();

        if (loading) return;

        clearMessage(formMessage);

        let student;

        try {
            student = validateForm();
        } catch (error) {
            showMessage(formMessage, error.message);
            return;
        }

        loading = true;
        submitButton.disabled = true;

        try {
            if (editingId !== null) {
                await request(`${apiUrl}/${editingId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(student)
                });

                showMessage(
                    formMessage,
                    "Student updated successfully!",
                    "success"
                );
            } else {
                await request(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(student)
                });

                showMessage(
                    formMessage,
                    "Student registered successfully!",
                    "success"
                );
            }

            resetForm();
            await loadStudents();
        } catch (error) {
            showMessage(formMessage, error.message);
        } finally {
            loading = false;
            submitButton.disabled = false;
        }
    });

    function editStudent(id) {
        const student = allStudents.find(
            item => String(item.id) === String(id)
        );

        if (!student) {
            showMessage(formMessage, "Student not found.");
            return;
        }

        editingId = student.id;

        nameInput.value = student.name ?? "";
        emailInput.value = student.email ?? "";
        courseInput.value = student.course ?? "";
        ageInput.value = student.age ?? "";

        formTitle.textContent = "Edit Student";
        submitButton.textContent = "Update Student";
        cancelButton.hidden = false;

        clearMessage(formMessage);
        document.querySelector(".panel").scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

        nameInput.focus();
    }

    async function deleteStudent(id) {
        const student = allStudents.find(
            item => String(item.id) === String(id)
        );

        if (!student) return;

        if (!confirm(`Delete student "${student.name}"? This cannot be undone.`)) {
            return;
        }

        clearMessage(listMessage);

        try {
            await request(`${apiUrl}/${id}`, { method: "DELETE" });

            if (String(editingId) === String(id)) {
                resetForm();
            }

            showMessage(listMessage, "Student deleted successfully.", "success");
            await loadStudents();
        } catch (error) {
            showMessage(listMessage, error.message);
        }
    }

    function resetForm() {
        form.reset();
        editingId = null;

        formTitle.textContent = "Register a Student";
        submitButton.textContent = "Add Student";
        cancelButton.hidden = true;
    }

    cancelButton.addEventListener("click", () => {
        resetForm();
        clearMessage(formMessage);
    });

    searchInput.addEventListener("input", renderStudents);
    courseFilter.addEventListener("change", renderStudents);

    document.getElementById("refreshButton").addEventListener(
        "click", loadStudents
    );

    loadStudents();
</script>

</body>
</html>
